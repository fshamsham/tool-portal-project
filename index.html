<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biology Tools</title>
  <script>try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="site-title"><a href="./">Biology Tools</a></p>
      <button type="button" class="button theme-toggle" data-theme-toggle aria-pressed="false">
        <span data-theme-icon aria-hidden="true">☾</span>
        <span>Dark theme</span>
      </button>
    </div>
  </header>

  <main class="container">
    <h1>Biology Tools</h1>
    <p class="intro">Small, hands-on web tools for learning biology. Pick a tool to try it out.</p>

    <h2>Tools</h2>
    <!-- Add one <li class="card"> per tool. Each links to tools/<tool-name>/ -->
    <ul class="card-grid">
      <li class="card">
        <span class="tag">Placeholder</span>
        <h3>Tool 1 — coming soon</h3>
        <p>A stand-in card to test opening a tool and coming back.</p>
        <a class="button" href="tools/tool-1/">Open tool</a>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">More tools coming soon.</div>
  </footer>
</body>
</html>
